[workspace]
resolver = "2"
members = [
    "crates/navcore",
    "crates/navcore-ffi",
    "uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
strip = false
debug = 1
