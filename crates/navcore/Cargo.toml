[package]
name = "navcore"
description = "Pure Rust turn-by-turn navigation core: geometry, location filtering, map matching, trip state."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "navcore"
path = "src/lib.rs"

[features]
default = []
# Enables serde derives on route/location types and JSON loading for fixtures and tests.
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
rstar = "0.12"
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "geo"
harness = false

[[bench]]
name = "matcher"
harness = false

[[bench]]
name = "navigator"
harness = false

[[example]]
name = "gen_fixtures"
required-features = ["serde"]
