[package]
name = "navcore-ffi"
description = "UniFFI bindings layer over navcore. Thin wrappers only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "navcore_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
navcore = { path = "../navcore", features = ["serde"] }
uniffi = { workspace = true }
thiserror = "2"
