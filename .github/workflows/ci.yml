name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / bench-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
      - name: benches compile
        run: cargo bench -p navcore --no-run

  android:
    name: Android AAR + demo APK + JVM tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: cross-compile + bindings
        run: scripts/build-android.sh
      - name: gradle
        working-directory: android
        run: ./gradlew :navsdk:assembleRelease :demo:assembleDebug :navsdk:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: navsdk-android
          path: |
            android/navsdk/build/outputs/aar/*.aar
            android/demo/build/outputs/apk/debug/*.apk

  ios:
    name: iOS XCFramework + simulator tests
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: build xcframework (simulator only) + bindings
        run: SKIP_DEVICE=1 scripts/build-ios.sh
      - name: pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              ver=tuple(int(x) for x in rt.split("iOS-")[1].split("-"))
              for dev in devs:
                  if dev["name"].startswith("iPhone"):
                      if best is None or ver>best[0]: best=(ver,dev["udid"],dev["name"])
          print(best[1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: xcodebuild build test
        run: |
          xcodebuild -project ios/Demo/Demo.xcodeproj -scheme Demo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath target/ios-derived build test | xcpretty || \
          xcodebuild -project ios/Demo/Demo.xcodeproj -scheme Demo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath target/ios-derived build test
      - uses: actions/upload-artifact@v4
        with:
          name: navsdk-ios
          path: ios/NavSDK/NavCoreFFI.xcframework
