name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / bench-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
      - name: benches compile
        run: cargo bench -p navcore --no-run

  android:
    name: Android AAR + demo APK + JVM tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: boltffi_cli
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: "A (pull): cross-compile + UniFFI bindings"
        run: scripts/build-android.sh
      - name: "B (push): cross-compile + BoltFFI bindings + desktop JNI library"
        run: scripts/build-boltffi-android.sh
      - name: gradle
        working-directory: android
        run: >-
          ./gradlew :navsdk:assembleRelease :navsdk-push:assembleRelease :demo:assembleDebug
          :navsdk:testDebugUnitTest :navsdk-push:testDebugUnitTest --console=plain
      - name: boundary benchmark (JVM)
        run: SKIP_IOS=1 scripts/bench-boundary.sh
      - uses: actions/upload-artifact@v4
        with:
          name: navsdk-android
          path: |
            android/navsdk/build/outputs/aar/*.aar
            android/navsdk-push/build/outputs/aar/*.aar
            android/demo/build/boundary-bench.md

  ios:
    name: iOS XCFramework + simulator tests
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: boltffi_cli
      - name: "A (pull): xcframework (simulator only) + UniFFI bindings"
        run: SKIP_DEVICE=1 scripts/build-ios.sh
      - name: "B (push): xcframework + BoltFFI bindings"
        run: scripts/build-boltffi-ios.sh
      - name: pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              ver=tuple(int(x) for x in rt.split("iOS-")[1].split("-"))
              for dev in devs:
                  if dev["name"].startswith("iPhone"):
                      if best is None or ver>best[0]: best=(ver,dev["udid"],dev["name"])
          print(best[1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: xcodebuild build test
        run: |
          xcodebuild -project ios/Demo/Demo.xcodeproj -scheme Demo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath target/ios-derived build test | xcpretty || \
          xcodebuild -project ios/Demo/Demo.xcodeproj -scheme Demo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath target/ios-derived build test
      - uses: actions/upload-artifact@v4
        with:
          name: navsdk-ios
          path: |
            ios/NavSDK/NavCoreFFI.xcframework
            ios/NavSDKPush/NavCorePush.xcframework
